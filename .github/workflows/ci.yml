name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка зависимостей
        run: pip install -e ".[dev]"

      - name: Линтер
        run: ruff check app alembic tests

      # Строгий режим включён в pyproject.toml, но до сих пор нигде не
      # запускался — за это время накопился 21 разрыв типов, среди которых
      # были и настоящие. Теперь проверка обязательная.
      - name: Типы
        run: mypy app

      # Тесты не требуют ни Postgres, ни Redis: Redis подменяется на
      # in-memory, схема сверяется с миграциями офлайн через рендер SQL.
      - name: Тесты
        run: pytest -q

      # На обычных прогонах — справочно: новая CVE в транзитивной зависимости
      # появляется независимо от нас и часто без готового исправления, и
      # красная сборка на ровном месте приучает не смотреть на неё вовсе.
      # А вот выпускать релиз с известной дырой нельзя, поэтому на теге та же
      # проверка обязательна.
      - name: Уязвимости в зависимостях
        run: pip-audit --strict --desc
        continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/') }}

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Сборка образа
        run: docker build -t rtspgw-api:ci backend

      # Та же логика, что и у pip-audit: на теге находки роняют сборку,
      # на обычном пуше остаются в логе.
      - name: Сканирование образа
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: rtspgw-api:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '0' }}

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Синтаксис shell-скриптов
        run: |
          for f in install.sh uninstall.sh ops/*.sh tests/*.sh; do
            bash -n "$f" || exit 1
          done

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # Ошибки роняют сборку: это не стилистика, а неработающий скрипт.
          shellcheck --severity=error install.sh uninstall.sh ops/*.sh
          # Предупреждения — справочно, как и было.
          shellcheck --severity=warning install.sh uninstall.sh ops/*.sh || true

      - name: Тесты установщика
        run: bash tests/test_install_sh.sh

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Проверка docker-compose
        run: |
          cp .env.example .env
          mkdir -p secrets && echo placeholder > secrets/app_key
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.monitoring.yml config --quiet
        env:
          GRAFANA_PASSWORD: ci-placeholder
