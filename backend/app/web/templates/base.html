<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
{% if user %}
<header class="topbar">
  <a class="brand" href="/">{{ app_name }}</a>
  <nav>
    <a href="/">Камеры</a>
    {% if user.role == Role.admin %}
      <a href="/admin/users">Пользователи</a>
      <a href="/admin/audit">Журнал</a>
    {% endif %}
    <a href="/profile">{{ user.email }}</a>
    <form method="post" action="/logout" class="inline">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button type="submit" class="link-button">Выйти</button>
    </form>
  </nav>
</header>
{% endif %}

<main class="container">
  {% if notice %}<div class="alert alert-ok">{{ notice }}</div>{% endif %}
  {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
  {% block content %}{% endblock %}
</main>
{% if user %}<script src="/static/panel.js" defer></script>{% endif %}
</body>
</html>
