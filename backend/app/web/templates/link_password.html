{% extends "base.html" %}
{% block title %}Пароль доступа{% endblock %}
{% block content %}
<div class="card card-narrow">
  <h1>{{ camera_name }}</h1>
  <p class="muted">Владелец защитил эту ссылку паролем.</p>
  <form method="post" action="/v/{{ slug }}">
    <input type="hidden" name="token" value="{{ token }}">
    <input type="hidden" name="embed" value="{{ '1' if embed else '' }}">
    <label>Пароль
      <input type="password" name="link_password" required autofocus autocomplete="off">
    </label>
    <button type="submit" class="primary">Смотреть</button>
  </form>
</div>
{% endblock %}
