{% extends "base.html" %}
{% block title %}Пароль доступа{% endblock %}
{% block content %}
<div class="card card-narrow">
  <h1>{{ camera_name }}</h1>
  <p class="muted small">Владелец защитил эту ссылку паролем.</p>
  <form method="post" action="/v/{{ slug }}">
    <input type="hidden" name="token" value="{{ token }}">
    <input type="hidden" name="embed" value="{{ '1' if embed else '' }}">
    <div class="field">
      <label for="link-pw">Пароль</label>
      <input id="link-pw" type="password" name="link_password" required autofocus
             autocomplete="off">
    </div>
    <button type="submit" class="btn btn-primary btn-block">
      <svg class="i" aria-hidden="true"><use href="#i-play"></use></svg>Смотреть
    </button>
  </form>
</div>
{% endblock %}
