{% extends "base.html" %}
{% block title %}Новый пароль — {{ app_name }}{% endblock %}
{% block content %}
<div class="card card-narrow">
  <h1>Новый пароль</h1>
  <p class="muted small">Для учётной записи {{ email }}.</p>

  <form method="post" action="/reset/{{ token }}">
    <div class="field">
      <label for="reset-password">Новый пароль</label>
      <input id="reset-password" type="password" name="password" required minlength="12"
             autocomplete="new-password" autofocus>
      <span class="hint">Не короче 12 символов</span>
    </div>
    <div class="field">
      <label for="reset-confirm">Повторите пароль</label>
      <input id="reset-confirm" type="password" name="confirm_password" required
             minlength="12" autocomplete="new-password">
    </div>
    <button type="submit" class="btn btn-primary btn-block">Сохранить и войти</button>
  </form>
  <p class="hint">После смены пароля все открытые сеансы будут завершены.</p>
</div>
{% endblock %}
