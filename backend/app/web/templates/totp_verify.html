{% extends "base.html" %}
{% block title %}Подтверждение входа — {{ app_name }}{% endblock %}
{% block content %}
<div class="card card-narrow">
  <h1>Код подтверждения</h1>
  <p class="muted small">Введите шестизначный код из приложения-аутентификатора либо один
     из кодов восстановления.</p>
  <form method="post" action="/login/2fa">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="next" value="{{ next }}">
    <div class="field">
      <label for="otp-code">Код</label>
      <input id="otp-code" type="text" name="code" required autofocus inputmode="numeric"
             autocomplete="one-time-code" maxlength="16" pattern="[0-9a-zA-Z\-]{6,16}">
    </div>
    <button type="submit" class="btn btn-primary btn-block">Подтвердить</button>
  </form>
</div>
{% endblock %}
