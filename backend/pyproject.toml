[project]
name = "rtspgw"
version = "0.1.0"
description = "RTSP -> HTTPS gateway: панель, авторизация, публичные ссылки"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0",
    "asyncpg>=0.30,<0.32",
    "alembic>=1.14,<2.0",
    "redis>=5.2,<7.0",
    "httpx>=0.28,<1.0",
    "jinja2>=3.1.4,<4.0",
    "python-multipart>=0.0.20,<1.0",
    "argon2-cffi>=23.1,<26.0",
    "pynacl>=1.5,<2.0",
    "pyotp>=2.9,<3.0",
    "qrcode>=8.0,<9.0",
    "structlog>=24.4,<26.0",
    # База часовых поясов для zoneinfo: в slim-образе и на Windows её нет,
    # а без неё падает перевод времени журнала в местное.
    "tzdata>=2024.2",
    "prometheus-client>=0.21,<1.0",
]

[project.optional-dependencies]
dev = [
    # Нижняя граница — не вкусовщина: в pytest до 9.0.3 каталог
    # /tmp/pytest-of-<user> создаётся с предсказуемым именем (PYSEC-2026-1845).
    # На проде это не влияет — pytest в образ не ставится, — но `pip-audit
    # --strict` в CI обязателен на теге, и прежняя граница `<9.0` отсекала
    # единственное исправление: релиз падал бы на собственной проверке.
    "pytest>=9.0.3,<10.0",
    "pytest-asyncio>=0.24,<2.0",
    # [lua] — блокировка PTZ снимается Lua-скриптом (сравнение владельца и
    # удаление одним шагом). Без этого extra fakeredis отвечает на EVAL
    # «unknown command», и скрипты остались бы без единого теста.
    "fakeredis[lua]>=2.26,<3.0",
    "pyyaml>=6.0,<7.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2.0",
    "pip-audit>=2.7,<3.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC", "RUF"]
ignore = [
    # FastAPI-зависимости в значениях по умолчанию — идиома фреймворка.
    "B008",
    # Комментарии и строки на русском: кириллические буквы здесь намеренные.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
ignore_missing_imports = true

# redis-py описывает команды одним классом на синхронный и асинхронный клиент,
# поэтому статически они возвращают `Awaitable[T] | T`, и каждый `await` над
# ними mypy считает ошибкой. Ошибка ложная — у `redis.asyncio` там всегда
# awaitable, — но она сыпалась на два десятка мест и прятала настоящие.
# follow_imports=skip делает типы redis непрозрачными; возвращаемые значения
# мы и так приводим явно (bool(), int(), str()).
[[tool.mypy.overrides]]
module = "redis.*"
follow_imports = "skip"
