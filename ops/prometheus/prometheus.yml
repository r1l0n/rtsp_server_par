global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: []   # укажите alertmanager:9093, когда поднимете его

scrape_configs:
  # Метрики приложения: камеры по статусам, действующие ссылки, зрители.
  # Ходим напрямую в docker-сеть: снаружи /metrics закрыт Caddy.
  - job_name: rtspgw-api
    static_configs:
      - targets: ['api:8000']

  # Метрики медиа-сервера: битрейты, число читателей, состояние путей.
  - job_name: mediamtx
    static_configs:
      - targets: ['mediamtx:9998']
